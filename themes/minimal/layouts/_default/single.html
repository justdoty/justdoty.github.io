{{ define "main" }}
<article class="container prose page post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="muted">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{- with .Params.author }} · {{ . }}{{ end }}
    </p>
  </header>
  {{ .Content }}
  {{- with .Parent }}
  <p class="post-back"><a href="{{ .RelPermalink }}">&larr; All posts</a></p>
  {{- end }}
</article>
{{ end }}
